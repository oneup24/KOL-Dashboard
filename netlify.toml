[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify serves from the domain root, unlike the GitHub Pages project page
  # which lives under /KOL-Dashboard/. See vite.config.ts.
  BASE_PATH = "/"

# The app uses hash routing, so every route lives on the index document and
# needs no rewrite. The static /c/<slug>/ pages are real files and are served
# as-is; anything else falls through to 404.html, which bounces back to the app.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
